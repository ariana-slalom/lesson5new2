<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Ariana De Ryss - designer, creative thinker, and collector of good ideas." />
    <meta name="theme-color" content="#1d2520" />
    <title>Ariana De Ryss | My Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />

  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="page-shell">
      <section class="profile-card" aria-labelledby="profile-name">
        <div class="card-topline">
          <span class="eyebrow">MY LINK / 2026</span>
          <button class="theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="false">

            <span class="toggle-icon toggle-icon-sun" aria-hidden="true">☼</span>
          </button>
        </div>

        <div class="profile-intro">
          <div class="avatar" aria-label="Profile photo placeholder" role="img">
            <span class="avatar-initials">AR</span>
            <span class="avatar-spark avatar-spark-one" aria-hidden="true"></span>
            <span class="avatar-spark avatar-spark-two" aria-hidden="true"></span>

          <p class="availability"><span class="availability-dot"></span> Available for thoughtful work</p>

        <nav class="link-list" aria-label="Ariana's links">
          <a class="link-button link-button-featured" href="https://deryssdesign.com" target="_blank" rel="noreferrer">
            <span class="link-icon" aria-hidden="true">

            <span class="link-copy"><strong>Portfolio</strong><small>deryssdesign.com</small></span>

          </a>
          <a class="link-button" href="https://www.linkedin.com/in/ariana-de-ryss/" target="_blank" rel="noreferrer">
            <span class="link-icon" aria-hidden="true">

            <span class="link-arrow" aria-hidden="true">↗</span>
          </a>
          <a class="link-button" href="mailto:ariana.de.ryss@gmail.com">
            <span class="link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img"><path d="m4 6 8 6 8-6M5 18h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1Z" /></svg>
            </span>
            <span class="link-copy"><strong>Email me</strong><small>ariana.de.ryss@gmail.com</small></span>
            <span class="link-arrow" aria-hidden="true">↗</span>
          </a>
        </nav>

        <footer class="site-footer">
          <span class="footer-line"></span>
          <p>Made with <span class="tea-mark" aria-label="tea">♡</span> tea and Copilot</p>
          <span class="footer-line"></span>
